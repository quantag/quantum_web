<div class="file-manager">
  <!-- Current Path -->
  <div class="current-path">
    <strong>Current Path:</strong> /{{ currentPath }}
  </div>

  <!-- Actions -->
  <div class="actions">
    <button (click)="goUp()" [disabled]="currentPath === ''">&#8593; Up</button>
    <button (click)="refresh()">&#8635; Refresh</button>
    <input type="text" [(ngModel)]="newFolderName" placeholder="New folder name">
    <button (click)="createNewFolder()" [disabled]="!newFolderName.trim()">📁 Create Folder</button>
  </div>

  <!-- File Upload -->
  <div class="upload-section">
    <input type="file" class="file-input" #fileInput (change)="onFileSelected($event)" multiple>
    <button (click)="fileInput.click()" type="button">
      📄 Choose Files
    </button>
    <button (click)="uploadFiles()" [disabled]="!selectedFiles || selectedFiles.length === 0">
      📤 Upload Files
    </button>
    <span *ngIf="selectedFiles && selectedFiles.length > 0" class="selected-files-info">
      {{ selectedFiles.length }} file(s) selected
    </span>
  </div>

  <!-- Loading indicator -->
  <div *ngIf="loading" class="loading">Loading...</div>

  <!-- Error message -->
  <div *ngIf="errorMessage" class="error">{{ errorMessage }}</div>

  <!-- File list -->
  <div class="file-table-container" *ngIf="!loading">
    <table class="file-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Type</th>
          <th>Size</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr 
          *ngFor="let item of fileItems" 
          class="file-row"
          [class.directory]="item.isDirectory"
          (dblclick)="handleDoubleClick(item)"
        >
          <td class="file-name">
            <span class="file-icon">{{ item.isDirectory ? '📁' : '📄' }}</span>
            {{ item.name }}
          </td>
          <td class="file-type">{{ item.isDirectory ? 'Folder' : 'File' }}</td>
          <td class="file-size">{{ getItemSize(item) }}</td>
          <td class="file-actions">
            <div class="action-buttons">
              <button 
                *ngIf="!item.isDirectory" 
                type="button"
                class="download-btn"
                (click)="downloadFile(item.name)"
                title="Download file"
              >
                <img src="assets/images/download-icon.svg" alt="download-icon">
              </button>
              <button 
                type="button"
                class="remove-btn"
                (click)="deleteItem(item.name)"
                title="Delete item"
              >
                <img src="assets/images/trash-icon.svg" alt="trash-icon">
              </button>
              <button 
                type="button"
                class="rename-btn"
                (click)="startRename(item)"
                title="Rename item"
              >
                &#9998;
              </button>
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Rename modal -->
  <div *ngIf="renamingItem" class="modal">
    <div class="modal-content">
      <h3>Rename {{ renamingItem.name }}</h3>
      <input type="text" [(ngModel)]="newName" [value]="renamingItem.name">
      <div class="modal-actions">
        <button (click)="confirmRename()">&#10004; Rename</button>
        <button (click)="cancelRename()">&#10006; Cancel</button>
      </div>
    </div>
  </div>
</div>
