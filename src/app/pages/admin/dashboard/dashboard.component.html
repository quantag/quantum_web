<div class="dashboard-container">
  <div class="dashboard-header">
    <div class="header-content">
      <h1>Admin Dashboard</h1>
      <p>Monitor endpoint health and status</p>
    </div>
    <div class="header-actions">
      <button class="check-all-btn" (click)="checkAllEndpoints()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
        Check All
      </button>
      <button class="logout-btn" (click)="logout()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        Logout
      </button>
    </div>
  </div>

  <div class="endpoints-list">
    <div class="endpoint-card" *ngFor="let endpoint of endpoints">
      <div class="endpoint-info">
        <h3 class="endpoint-name">{{ endpoint.name }}</h3>
        <p class="endpoint-url">{{ endpoint.url }}</p>
        <div class="endpoint-status" *ngIf="endpoint.status">
          <span 
            class="status-badge" 
            [class.success]="endpoint.status === 'success'"
            [class.error]="endpoint.status === 'error'"
            [class.checking]="endpoint.status === 'checking'">
            <svg *ngIf="endpoint.status === 'success'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            <svg *ngIf="endpoint.status === 'error'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="15" y1="9" x2="9" y2="15"></line>
              <line x1="9" y1="9" x2="15" y2="15"></line>
            </svg>
            <svg *ngIf="endpoint.status === 'checking'" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spinner">
              <line x1="12" y1="2" x2="12" y2="6"></line>
              <line x1="12" y1="18" x2="12" y2="22"></line>
              <line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line>
              <line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line>
              <line x1="2" y1="12" x2="6" y2="12"></line>
              <line x1="18" y1="12" x2="22" y2="12"></line>
              <line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line>
              <line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line>
            </svg>
            {{ endpoint.status === 'checking' ? 'Checking...' : endpoint.status === 'success' ? 'Healthy' : 'Error' }}
          </span>
          <span class="status-code" *ngIf="endpoint.statusCode !== undefined">
            Code: {{ endpoint.statusCode }}
          </span>
        </div>
        <p class="status-message" *ngIf="endpoint.message">{{ endpoint.message }}</p>
      </div>
      <button class="check-btn" (click)="checkEndpoint(endpoint)" [disabled]="endpoint.status === 'checking'">
        Check
      </button>
    </div>
  </div>
</div>
