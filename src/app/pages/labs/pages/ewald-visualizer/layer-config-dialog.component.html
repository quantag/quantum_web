<div class="dialog-header">
  <h2 mat-dialog-title>
    <mat-icon>layers</mat-icon>
    Configure 3D Layers
  </h2>
</div>

<mat-dialog-content>
  <p class="config-description">
    Drag to reorder layers from bottom (first) to top (last). Check layers to include them in the 3D visualization. Adjust opacity for selected layers using the slider.
  </p>

  <div cdkDropList class="layer-list" (cdkDropListDropped)="drop($event)">
    <div class="layer-box" *ngFor="let layer of layers" cdkDrag>
      <div class="layer-custom-placeholder" *cdkDragPlaceholder></div>
      
      <div class="layer-header">
        <div class="layer-handle" cdkDragHandle>
          <mat-icon>drag_indicator</mat-icon>
        </div>

        <mat-checkbox 
          [(ngModel)]="layer.selected" 
          [name]="'selected-' + layer.index"
          color="primary">
          <div class="layer-info">
            <span class="layer-color-dot" [style.background-color]="getLayerColor(layer.name)"></span>
            <span class="layer-name">{{ layer.name }}</span>
          </div>
        </mat-checkbox>
      </div>

      <div class="layer-controls" *ngIf="layer.selected">
        <div class="opacity-control">
          <label class="opacity-label">Opacity:</label>
          <mat-slider 
            min="0" 
            max="1" 
            step="0.05"
            discrete
            class="opacity-slider">
            <input matSliderThumb [(ngModel)]="layer.opacity" [name]="'opacity-' + layer.index">
          </mat-slider>
          <span class="opacity-value">{{ (layer.opacity * 100) | number:'1.0-0' }}%</span>
        </div>
        
        <div class="color-control">
          <label class="color-label">Color:</label>
              <input 
              type="text" 
              [(ngModel)]="layer.color"
              [colorPicker]="layer.color"
              (colorPickerChange)="layer.color = $event"
              [style.background]="layer.color"
              [cpPosition]="'bottom'"
              [cpOutputFormat]="'hex'"
              [cpAlphaChannel]="'disabled'"

              [name]="'color-' + layer.index"
              class="color-picker-input"
              readonly>
          </div>
      </div>
    </div>
  </div>
</mat-dialog-content>

<mat-dialog-actions align="end" class="dialog-actions">
  <button mat-button class="cancel-btn" (click)="cancel()">Cancel</button>
  <button mat-flat-button class="apply-btn" (click)="apply()">
    <mat-icon style="margin-right: 4px; font-size: 18px; height: 18px; width: 18px;">check</mat-icon>
    Apply 3D View
  </button>
</mat-dialog-actions>
