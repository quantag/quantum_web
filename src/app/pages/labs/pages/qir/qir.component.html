<div class="qir-container">
    <app-lab-header title="OpenQASM Code Converter"></app-lab-header>

    <div class="converter-content">
        <div class="converter-grid">
            <!-- OpenQASM Input Section -->
            <div class="input-section">
                <div class="section-header">
                    <h3>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 12L11 14L15 10"/>
                            <path d="M21 12C21 16.9706 16.9706 21 12 21C7.02944 21 3 16.9706 3 12C3.25806 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12Z"/>
                        </svg>
                        OpenQASM Code
                    </h3>
                    <div class="section-actions">
                        <button 
                            type="button" 
                            (click)="clearFields()" 
                            class="clear-btn"
                            [disabled]="isConverting"
                        >
                            Clear
                        </button>
                    </div>
                </div>
                
                <textarea
                    [(ngModel)]="openQasmCode"
                    placeholder="Enter your OpenQASM code here...&#10;&#10;Example:&#10;OPENQASM 2.0;&#10;include &quot;qelib1.inc&quot;;&#10;qreg q[2];&#10;creg c[2];&#10;h q[0];&#10;cx q[0],q[1];&#10;measure q -> c;"
                    class="code-textarea openqasm-input"
                    [disabled]="isConverting"
                ></textarea>
            </div>

            <!-- Convert Button -->
            <div class="convert-section">
                <button 
                    type="button" 
                    (click)="convertToQir()" 
                    class="convert-btn"
                    [disabled]="!openQasmCode.trim() || isConverting"
                >
                    <svg *ngIf="!isConverting" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M5 12H19M19 12L12 5M19 12L12 19"/>
                    </svg>
                    <svg *ngIf="isConverting" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                    {{ isConverting ? 'Converting...' : 'Convert' }}
                </button>

                <!-- Error Message -->
                <div *ngIf="errorMessage" class="error-message">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    {{ errorMessage }}
                </div>
            </div>

            <!-- Output Section -->
            <div class="output-section">
                <div class="section-header">
                    <h3>
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="7" height="7" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" rx="1"/>
                            <path d="M10 6.5h4"/>
                            <path d="M10 17.5h4"/>
                            <path d="M6.5 10v4"/>
                            <path d="M17.5 10v4"/>
                            <circle cx="12" cy="12" r="1.5"/>
                        </svg>
                        {{ selectedFormat }} Output
                    </h3>
                    <div class="section-actions">
                        <!-- Format Selection Dropdown -->
                        <select 
                            [(ngModel)]="selectedFormat" 
                            class="format-dropdown"
                            [disabled]="isConverting"
                        >
                            <option *ngFor="let format of conversionFormats" [value]="format.value">
                                {{ format.label }}
                            </option>
                        </select>
                        
                        <button 
                            type="button" 
                            (click)="copyResponseCode()" 
                            class="copy-btn"
                            [disabled]="!responseCode"
                        >
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            Copy
                        </button>
                    </div>
                </div>
                
                <textarea
                    id="qir-output"
                    [(ngModel)]="responseCode"
                    [placeholder]="'Converted ' + selectedFormat + ' code will appear here...'"
                    class="code-textarea qir-output"
                    readonly
                ></textarea>
            </div>
        </div>
    </div>
</div>
