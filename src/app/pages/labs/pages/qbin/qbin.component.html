<div class="qbin-container">
    <app-lab-header title="QBIN Converter"></app-lab-header>

    <div class="converter-content">
        <div class="converter-grid">
            <!-- Input Section -->
            <div class="input-section">
                <div class="section-header">
                    <h3>
                        {{ inputLabel }}
                    </h3>
                    <div class="section-actions">
                        <button 
                            type="button" 
                            (click)="copyInputData()" 
                            class="copy-btn"
                            [disabled]="!inputData"
                        >
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            Copy
                        </button>
                        <button 
                            type="button" 
                            (click)="clearFields()" 
                            class="clear-btn"
                            [disabled]="isConverting"
                        >
                            Clear
                        </button>
                    </div>
                </div>
                
                <textarea
                    [(ngModel)]="inputData"
                    [placeholder]="inputPlaceholder"
                    class="code-textarea"
                    [class.openqasm-input]="conversionMode === 'qasmToQbin'"
                    [class.qbin-input]="conversionMode === 'qbinToQasm'"
                    [disabled]="isConverting"
                ></textarea>
            </div>

            <!-- Convert Button Section -->
            <div class="convert-section">
                <div class="convert-actions">
                    <button 
                        type="button" 
                        (click)="convert()" 
                        class="convert-btn encode-btn"
                        [disabled]="!inputData.trim() || isConverting"
                    >
                        {{ convertButtonLabel }}
                    </button>

                    <button 
                        type="button" 
                        (click)="downloadQbinFile()" 
                        class="download-btn"
                        [disabled]="!qbinData.trim()"
                        *ngIf="conversionMode === 'qasmToQbin'"
                    >
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7,10 12,15 17,10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Download .qbin
                    </button>

                    <button 
                        type="button" 
                        (click)="toggleConversionMode()" 
                        class="mode-toggle-btn"
                        [disabled]="isConverting"
                    >
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="17,1 21,5 17,9"/>
                            <path d="M3 11V9a4 4 0 0 1 4-4h14"/>
                            <polyline points="7,23 3,19 7,15"/>
                            <path d="M21 13v2a4 4 0 0 1-4 4H3"/>
                        </svg>
                        {{ switchModeButtonLabel }}
                    </button>
                </div>

                <!-- Error Message -->
                <div *ngIf="errorMessage" class="error-message">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="15" y1="9" x2="9" y2="15"/>
                        <line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    {{ errorMessage }}
                </div>
            </div>

            <!-- Output Section -->
            <div class="output-section">
                <div class="section-header">
                    <h3>
                        {{ outputLabel }}
                    </h3>
                    <div class="section-actions">
                        <!-- Output format toggle for QBIN mode -->
                        <div class="format-toggle-group" *ngIf="conversionMode === 'qasmToQbin'" [class.disabled]="!outputData">
                            <button 
                                type="button" 
                                (click)="setOutputMode('binary')" 
                                class="format-toggle-btn"
                                [class.active]="outputMode === 'binary'"
                                [disabled]="!outputData"
                            >
                                Binary
                            </button>
                            <button 
                                type="button" 
                                (click)="setOutputMode('hex')" 
                                class="format-toggle-btn"
                                [class.active]="outputMode === 'hex'"
                                [disabled]="!outputData"
                            >
                                Hex
                            </button>
                        </div>
                        
                        <button 
                            type="button" 
                            (click)="copyOutputData()" 
                            class="copy-btn"
                            [disabled]="!outputData"
                        >
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                            </svg>
                            Copy
                        </button>
                    </div>
                </div>
                
                <div class="output-content">
                    <textarea
                        [ngModel]="outputData"
                        placeholder="Output will appear here"
                        class="code-textarea"
                        [class.qbin-output]="conversionMode === 'qasmToQbin'"
                        [class.openqasm-output]="conversionMode === 'qbinToQasm'"
                        readonly
                    ></textarea>
                </div>
            </div>
        </div>
    </div>
</div>
